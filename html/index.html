<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/aside.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>

<body>
    <aside class="profile">
        <div class="content_profile">
            <div class="perfil">
                <div class="profile_icon">
                    <img src="../ims/icon/ori_icon.jpeg" alt="" srcset="">
                </div>
                <div class="profile_name">
                    <p>Ori</p>
                </div>
            </div>
            <nav class="features_app">
                <ul>
                    <li>
                        <div class="app_img">
                            <!-- <img src="../ims/feature_icon/money.png" alt=""> -->
                        </div>
                        <button class="btn_action btn_salario">Cadastrar Salario</button>
                    </li>
                    <li>
                        <div class="app_img">
                            <!-- <img src="../ims/feature_icon/money.png" alt=""> -->
                        </div>
                        <button class="btn_action">Contas a Pagar</button>
                    </li>
                    <li>
                        <div class="app_img">
                            <!-- <img src="../ims/feature_icon/money.png" alt=""> -->
                        </div>
                        <button class="btn_action">Gastos </button>
                    </li>
                    <li>
                        <div class="app_img">
                            <!-- <img src="../ims/feature_icon/money.png" alt=""> -->
                        </div>
                        <button class="btn_action">Investimentos</button>
                    </li>
                </ul>
            </nav>
            <div class="logout">
                <div class="content_logout">
                    <button>Sair</button>
                </div>
            </div>
        </div>
    </aside>
    <main>
        <section class="budget">
            <div class="budget_content">
                <div class="budget_info">
                    <p>SALDO TOTAL</p>

                    <div class="budget_info_content">
                        <p>Saldo atual:</p>
                    </div>
                </div>
                <div class="budget_info">
                    <p>GASTO TOTAL</p>
                    <div class="budget_info_content">
                        <p>Seu gasto: </p>
                    </div>

                </div>
                <div class="budget_info">
                    <p>CONTAS A PAGAR</p>
                    <div class="budget_info_content"></div>

                </div>
                <div class="budget_info">
                    <p>INVESTIMENTOS TOTAIS</p>
                    <div class="budget_info_content"></div>

                </div>
            </div>
        </section>
        <section class="data">
            <div class="data_content">
                <div class="data_info">
                    <p>ESTÁTISTICAS</p>
                    <div class="data_info_content"></div>
                </div>
                <div class="data_info">
                    <p>TRANSAÇÕES RECENTES</p>
                    <div class="data_info_content"></div>
                </div>
            </div>
        </section>
    </main>

</body>
<script src="../js/code.js"></script>

</html>
